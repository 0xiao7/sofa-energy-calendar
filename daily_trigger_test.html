const SYM = [{"id": "C1-01", "cat": "C1", "god": "比肩", "name": "固執己見讀法", "man": "堅持自己一套方法，聽不進更有效的做法", "act": "別只靠重讀。實證最有效的是「主動回憶」：讀完闔書默寫重點，再用一種公認有效的方法做一題比對正確率，讓效果決定方法。", "care": false}, {"id": "C1-02", "cat": "C1", "god": "比肩", "name": "同儕進度比較", "man": "老盯著別人讀到哪，思緒一直被拉走", "act": "社會比較會搶走專注。關掉進度群組，把基準改成「跟昨天的自己比」，只記錄自己今天完成的題數與弄懂的觀念。", "care": false}, {"id": "C1-03", "cat": "C1", "god": "比肩", "name": "不肯求助硬鑽", "man": "一題卡很久也不問，硬要自己想通", "act": "用 if-then 執行意圖：「若一題卡超過15分鐘，就標記、跳過、稍後集中問」，把無限鑽牛角尖換成具體提問。", "care": false}, {"id": "C1-04", "cat": "C1", "god": "劫財", "name": "多工分心", "man": "同時開好幾科，結果哪科都沒進去", "act": "多工會讓每件都變淺。改單工＋番茄鐘：一次只開一科、其餘分頁全關，專注25分鐘再休5分，完成一段才換科。", "care": false}, {"id": "C1-05", "cat": "C1", "god": "劫財", "name": "急著翻頁", "man": "沒讀懂就想往下衝，吸收很淺", "act": "讀懂比讀快重要。每讀一小段就用主動回憶闔書講一次重點，講不出來再回看，把速度換成真正吸收。", "care": false}, {"id": "C1-06", "cat": "C1", "god": "劫財", "name": "雜訊搶神", "man": "一有通知就被勾走思緒", "act": "通知是最強的分心源。手機調勿擾＋灰階、放到看不到的地方，專注25分鐘再一次處理訊息（刺激控制）。", "care": false}, {"id": "C1-07", "cat": "C1", "god": "食神", "name": "越讀越離題", "man": "查一個點延伸到一堆無關內容", "act": "延伸查詢會吃掉主線。把岔出去的點寫到「之後再查」清單，先用番茄鐘做完當前段落，離題就把視線拉回那一行。", "care": false}, {"id": "C1-08", "cat": "C1", "god": "食神", "name": "舒適區打轉", "man": "只挑喜歡的章節讀，難的繞過", "act": "只挑舒適區會放大弱項。用 if-then：「先做一題最不想碰的，再回喜歡的」，把難題拆到最小步再開始。", "care": false}, {"id": "C1-09", "cat": "C1", "god": "食神", "name": "邊讀邊神遊", "man": "想像考上後的事，眼到心不到", "act": "神遊代表注意力斷線。起身喝水30秒重啟，回座設一個5–15分鐘的明確小目標，用主動回憶把心拉回文本。", "care": false}, {"id": "C1-10", "cat": "C1", "god": "傷官", "name": "嫌教材挑出題", "man": "一直挑剔課本/老師講法，沒在吸收", "act": "挑剔常是逃避吸收。把吐槽寫到筆記欄，正文先照單全收、做主動回憶；有疑慮標記，留到複習時再驗證。", "care": false}, {"id": "C1-11", "cat": "C1", "god": "傷官", "name": "鑽冷門細節", "man": "執著考點外的枝節想反駁", "act": "先問「這會考嗎」。對照考綱，非考點先略過、記下；把精力放到高頻考點的提取練習上，別被枝節綁住。", "care": false}, {"id": "C1-12", "cat": "C1", "god": "傷官", "name": "自以為懂", "man": "看過一遍就覺得會了不複習", "act": "「看過」不等於會。用提取練習檢驗：闔書默寫或做幾題，寫不出來的才是真正該補的，別讓熟悉感騙了你。", "care": false}, {"id": "C1-13", "cat": "C1", "god": "偏財", "name": "貪多開太多書", "man": "同類教材買一堆同時翻", "act": "多買多開反而更亂。鎖定一套主教材讀通，其餘收起來；一個主題只跟一條主線，讀完用主動回憶確認再換。", "care": false}, {"id": "C1-14", "cat": "C1", "god": "偏財", "name": "被外務勾走", "man": "讀書時忙別的小事與訊息", "act": "雜事勾走的是專注。用「雜事時段」：讀書中想到就寫下，集中到固定時段一次處理，當下只留這一科。", "care": false}, {"id": "C1-15", "cat": "C1", "god": "偏財", "name": "傳言式跳讀", "man": "聽說哪裡會考就亂跳章節", "act": "傳聞式跳讀打亂結構。照原章節序走，聽到的考點記下不立刻動；用考綱與歷屆題判斷權重，而非小道消息。", "care": false}, {"id": "C1-16", "cat": "C1", "god": "正財", "name": "過度算分", "man": "一直估自己幾分，而非真的讀進去", "act": "反覆估分會取代真讀。今天只記「讀完題數、弄懂觀念」，把算分排到每週一次，用過程指標取代結果焦慮。", "care": false}, {"id": "C1-17", "cat": "C1", "god": "正財", "name": "患得患失複習", "man": "怕忘，一直回頭重看舊內容", "act": "怕忘而一直回看效率低。改用間隔複習：依遺忘曲線排到期日，到期才回看一次，其餘時間往前推進度。", "care": false}, {"id": "C1-18", "cat": "C1", "god": "七殺", "name": "進度焦慮塞太滿", "man": "排到不可能完成的量", "act": "塞爆排程必崩。把計畫砍半、留兩成緩衝，用 if-then 設每日量上限；可達成的小計畫比完美計畫更有效。", "care": false}, {"id": "C1-19", "cat": "C1", "god": "七殺", "name": "自逼到腦空白", "man": "越逼越讀不進、一片空白", "act": "越逼越空白是焦慮佔走工作記憶。卡住就離桌走動5分鐘、做幾次慢吐氣呼吸降速，再從一個會的小題重新接上。", "care": false}, {"id": "C1-20", "cat": "C1", "god": "正官", "name": "筆記完美癖", "man": "花太多時間排版抄漂亮", "act": "美化筆記是低效學習。限時抄「自己看得懂的重點」、醜也接受；省下時間改做提取練習，筆記是為了回想不是好看。", "care": false}, {"id": "C1-21", "cat": "C1", "god": "正官", "name": "怕錯不敢往下", "man": "一處沒全懂就不肯推進度", "act": "怕錯而停滯會拖垮全局。先求走完一輪、抓主架構，沒全懂的標問號跳過，第二輪再補（先求80分再求完美）。", "care": false}, {"id": "C1-22", "cat": "C1", "god": "偏印", "name": "一題鑽到底", "man": "為一個冷僻點查到天荒地老", "act": "鑽冷僻點是無底洞。設時限，逾時就記下問人；先把高頻考點用提取練習讀熟，別在低報酬處耗光時間。", "care": false}, {"id": "C1-23", "cat": "C1", "god": "偏印", "name": "糾結哪種理解才對", "man": "在多種解法間反覆內耗", "act": "多解法內耗。先選一種你能算對的用熟，其他記下留複習時比較；能解題的理解，勝過糾結哪個最完美。", "care": false}, {"id": "C1-24", "cat": "C1", "god": "正印", "name": "備而不讀", "man": "整理工具/計畫卻遲遲沒開始", "act": "一直準備卻不開始是拖延。用兩分鐘起步法＋if-then：「鈴一響就讀兩分鐘」，把規劃時間壓到10分鐘內。", "care": false}, {"id": "C1-25", "cat": "C1", "god": "正印", "name": "等狀態好才讀", "man": "老覺得還沒準備好", "act": "不必等狀態好。行為先於動機：用兩分鐘起步法直接讀兩分鐘，動起來狀態多半會跟上，別等準備好才開始。", "care": false}, {"id": "C2-01", "cat": "C2", "god": "比肩", "name": "孤立硬撐情緒", "man": "難過也不說，自己扛", "act": "情緒悶著更重。每天找一個信任的人講一句真實心情，或用表達性書寫把感受寫下來；研究顯示書寫能降低焦慮與反芻。", "care": false}, {"id": "C2-02", "cat": "C2", "god": "比肩", "name": "好強不認累", "man": "累到不行還否認", "act": "否認疲勞會累積成崩盤。用1–10替疲勞評分，≥7就安排休息；把休息當必要投資，而非軟弱。", "care": false}, {"id": "C2-03", "cat": "C2", "god": "劫財", "name": "一點就炸", "man": "急躁易怒，火氣上得快", "act": "怒火上來先別反應。做幾次慢吐氣呼吸、離開現場幾分鐘再回應；在情緒高點不下判斷、不對話。", "care": false}, {"id": "C2-04", "cat": "C2", "god": "劫財", "name": "焦躁坐不住", "man": "心浮氣躁、靜不下來", "act": "焦躁多是身體張力。起身快走或伸展3–5分鐘把躁能釋放，再做配速呼吸降速，然後從一個最小任務切入。", "care": false}, {"id": "C2-05", "cat": "C2", "god": "食神", "name": "用吃紓壓過頭", "man": "一焦慮就猛吃", "act": "情緒性進食先按暫停。焦慮時先喝水＋走動5分鐘再決定吃；同時找替代出口（書寫、散步），處理情緒本身而非用吃壓。", "care": false}, {"id": "C2-06", "cat": "C2", "god": "食神", "name": "逃進耍廢", "man": "情緒一來就追劇逃避", "act": "逃避型耍廢越逃越空。設20分鐘限時放鬆鬧鐘，到點回到一個最小任務；用行為活化安排能帶來成就感的小事。", "care": false}, {"id": "C2-07", "cat": "C2", "god": "傷官", "name": "情緒外放遷怒", "man": "把壓力發在家人身上", "act": "遷怒前先離場。想發作時離開現場10分鐘、做慢呼吸降溫，把壓力寫下來而非倒在家人身上，冷靜後再溝通。", "care": false}, {"id": "C2-08", "cat": "C2", "god": "傷官", "name": "委屈感重", "man": "覺得沒人懂、抱怨變多", "act": "委屈寫下來比脫口而出有用。用表達性書寫把感受誠實寫出，實證能緩解焦慮與反芻；需要時找人說，而非到處抱怨。", "care": false}, {"id": "C2-09", "cat": "C2", "god": "偏財", "name": "被外界牽動", "man": "一則消息就大起大落", "act": "易被消息牽動就管理輸入。限定看消息的固定時段、其餘關通知；看到衝擊內容先深呼吸，提醒自己這不影響你的準備。", "care": false}, {"id": "C2-10", "cat": "C2", "god": "偏財", "name": "消費玩樂壓情緒", "man": "亂買亂滑來紓壓", "act": "衝動消費/滑手機是短效紓壓。設「想買先放24小時」規則，改用散步、書寫等真正能降載的方式處理情緒。", "care": false}, {"id": "C2-11", "cat": "C2", "god": "正財", "name": "患得患失", "man": "一直擔心努力會白費", "act": "患得患失多在不可控處打轉。列「可控/不可控」兩欄，只投入可控的今日行動；擔心會白費時，回到眼前能做的一步。", "care": false}, {"id": "C2-12", "cat": "C2", "god": "正財", "name": "怕落後同儕", "man": "比較後沮喪低落", "act": "比較後低落很常見。把基準從同儕改成「昨天的自己」、記錄自己的小進步；減少接觸進度展示，專注自己的軌道。", "care": false}, {"id": "C2-13", "cat": "C2", "god": "正財", "name": "成績焦慮", "man": "一次模考差就崩潰", "act": "把分數當回饋、不當判決。模考差就記下要補的點當健檢結果；先做一次慢呼吸降焦慮，再用提取練習補弱項。", "care": false}, {"id": "C2-14", "cat": "C2", "god": "七殺", "name": "高壓恐慌", "man": "一想到考試就心悸", "act": "用認知重評：把加速的心跳重新解讀為身體在幫你供氧、上場前的正常激活；再做3輪 4-7-8 配速呼吸降速。", "care": false}, {"id": "C2-15", "cat": "C2", "god": "七殺", "name": "自我攻擊", "man": "不停罵自己不夠好", "act": "自我攻擊用自我疼惜化解。把罵自己的話改寫成「你會對好朋友說的話」，就事論事找下一步，而非否定整個人。", "care": false}, {"id": "C2-16", "cat": "C2", "god": "七殺", "name": "倒數窒息感", "man": "倒數逼近喘不過氣", "act": "倒數窒息是被整體壓垮。用紙遮住整體倒數，只看「今天這一格」要做的事；把大範圍拆成今日可完成的小目標。", "care": false}, {"id": "C2-17", "cat": "C2", "god": "正官", "name": "怕辜負期待", "man": "背著家人期望喘不過", "act": "期待的重量先分清歸屬。寫下「我的目標 vs 別人的期待」兩欄，把不屬於你的放下；與家人具體溝通你需要的支持。", "care": false}, {"id": "C2-18", "cat": "C2", "god": "正官", "name": "過度自責", "man": "一個錯內疚一整天", "act": "一錯內疚整天會癱瘓。寫下「錯在哪＋下次怎麼做」然後翻頁；用自我疼惜的語氣，把自責換成具體可改的一步。", "care": false}, {"id": "C2-19", "cat": "C2", "god": "正官", "name": "壓抑不敢示弱", "man": "硬撐微笑不喊累", "act": "壓抑硬撐遲早外溢。允許自己每週一段「擺爛時段」正當休息，並對信任的人坦白狀態；示弱不是失敗，是讓你撐得久。", "care": false}, {"id": "C2-20", "cat": "C2", "god": "偏印", "name": "反芻負面念頭", "man": "同一個擔憂繞圈打轉", "act": "反芻會原地空轉。用「擔憂時段」：設15分鐘專門想，其餘時間想到就寫下、延後；搭配把注意力放回當下的活動。", "care": false}, {"id": "C2-21", "cat": "C2", "god": "偏印", "name": "莫名空虛", "man": "提不起勁、疏離", "act": "空虛時用行為活化破冰。先做一件5分鐘、能帶來完成感或意義的小事（連結、助人、整理），用行動帶回情緒。", "care": false}, {"id": "C2-22", "cat": "C2", "god": "偏印", "name": "半夜胡思", "man": "躺床放大焦慮", "act": "半夜胡思先清空大腦。把腦中事寫到紙上「都記下了明天處理」；躺20分鐘睡不著就起身做無聊的事、有睡意再回床（刺激控制）。", "care": false}, {"id": "C2-23", "cat": "C2", "god": "正印", "name": "討保證才安心", "man": "一直找人要安慰", "act": "一直討保證會更不安。先自己寫三句安撫＋一個可控行動，再去求證；練習容忍不確定，把安全感建立在行動而非他人保證。", "care": false}, {"id": "C2-24", "cat": "C2", "god": "正印", "name": "戀舒適逃現實", "man": "賴在被窩不面對", "act": "賴床逃避用最小啟動破解。起床先開窗、喝水、腳落地，用晨光與身體啟動；不必等想面對，先動兩分鐘。", "care": false}, {"id": "C2-25", "cat": "C2", "god": "正印", "name": "被動等情緒過去", "man": "消沉時什麼都不做", "act": "消沉時被動等待會更沉。用行為活化安排一件固定小活動（散步、出門曬光），先動身體再等情緒，不靠「等它過去」。", "care": false}, {"id": "C3-01", "cat": "C3", "god": "比肩", "name": "硬拚不休息", "man": "連坐數小時不離桌", "act": "久坐硬拚效率遞減。用番茄鐘：每50分鐘強制起身5–10分；把休息排進表當必做，有節奏的張弛比硬撐更持久。", "care": false}, {"id": "C3-02", "cat": "C3", "god": "比肩", "name": "拒絕現成方法", "man": "不照任何讀書範本", "act": "全自創常是繞路。先借一個有實證的框架（主動回憶＋間隔複習）用一週，有數據再微調，別從零硬試。", "care": false}, {"id": "C3-03", "cat": "C3", "god": "比肩", "name": "單打獨鬥", "man": "拒絕讀書會與共學", "act": "完全單打會少了回饋。保留每週一次跟人對答案或討論，用別人的提問檢驗你的盲點；社會支持也能降壓。", "care": false}, {"id": "C3-04", "cat": "C3", "god": "劫財", "name": "衝動改計畫", "man": "三天兩頭換讀法", "act": "一直換讀法等於沒方法。給一套計畫至少跑滿7天再用數據評估；頻繁改動會抹掉累積，先穩定再優化。", "care": false}, {"id": "C3-05", "cat": "C3", "god": "劫財", "name": "開頭多收尾少", "man": "啟動很多卻沒完成", "act": "開頭多收尾少。立規則「完成一項才准開下一項」，用 if-then 把任務切成可立刻完成的小步，先收尾再啟動新的。", "care": false}, {"id": "C3-06", "cat": "C3", "god": "劫財", "name": "亂花時間", "man": "被臨時起意帶走", "act": "被臨時起意帶走時間。前一晚寫好「今日三件必做」先清掉；用 if-then 預設何時做什麼，減少臨場決定的耗損。", "care": false}, {"id": "C3-07", "cat": "C3", "god": "食神", "name": "拖延享樂", "man": "先玩再說，一直延後", "act": "先玩再讀容易無限延。用「先讀25分換5分玩」固定順序＋誘惑綁定；把娛樂當完成後的獎勵，而非開頭。", "care": false}, {"id": "C3-08", "cat": "C3", "god": "食神", "name": "過度休息", "man": "休息一下變一下午", "act": "休息容易擴張。休息一律設鬧鐘、鈴響回桌；用刺激控制——休息離開書桌、回桌只做事，讓界線清楚。", "care": false}, {"id": "C3-09", "cat": "C3", "god": "食神", "name": "磨蹭暖機久", "man": "拖很久才開始", "act": "暖機太久是啟動門檻太高。用兩分鐘起步法：只要求做兩分鐘，動起來慣性會接手；把第一步縮到不可能失敗。", "care": false}, {"id": "C3-10", "cat": "C3", "god": "傷官", "name": "鑽捷徑跳基礎", "man": "只找考古題捷徑跳過基本功", "act": "跳過基礎抄捷徑會崩。基礎與題技各排固定時段；先把核心觀念用主動回憶讀通，再練題型，根基穩捷徑才有用。", "care": false}, {"id": "C3-11", "cat": "C3", "god": "傷官", "name": "半途想自創", "man": "嫌方法老、半路棄做", "act": "半路想自創常是逃避。先照標準方法做完一輪、看到成效再改良；承諾跑完一個完整週期，別在中途換軌。", "care": false}, {"id": "C3-12", "cat": "C3", "god": "傷官", "name": "愛現耗時", "man": "花時間做漂亮輸出給人看", "act": "美化輸出給人看會吃時間。產出先求完成、後求美化；把展示欲導向真正的提取練習與題數，而非排版好看。", "care": false}, {"id": "C3-13", "cat": "C3", "god": "偏財", "name": "多頭進行", "man": "同時搞太多項目", "act": "多頭並進樣樣淺。限制同時進行最多兩項、其餘排隊；用單工把心力集中，完成一項再開下一項。", "care": false}, {"id": "C3-14", "cat": "C3", "god": "偏財", "name": "被娛樂帶走", "man": "滑手機停不下來", "act": "滑手機停不下是設計使然。App 設使用時限、登出或移到深層資料夾，手機放遠；讀書時用刺激控制隔離誘因。", "care": false}, {"id": "C3-15", "cat": "C3", "god": "偏財", "name": "追新工具", "man": "一直換 app/文具不讀", "act": "一直換工具是高級拖延。工具凍結一個月只用現有的；把「找更好工具」的力氣，改投到實際做題與回想上。", "care": false}, {"id": "C3-16", "cat": "C3", "god": "正財", "name": "規劃不執行", "man": "表做很細卻沒動", "act": "規劃很細卻不動。把規劃時間壓到執行的1/5以內，用 if-then 直接把第一步排進今天某個時刻，先做再修。", "care": false}, {"id": "C3-17", "cat": "C3", "god": "正財", "name": "算投報才動", "man": "計較划不划算才開始", "act": "算划不划算會卡在起點。不評估，直接做完「最小一步」；行動會帶來資訊，先動起來再判斷值不值得。", "care": false}, {"id": "C3-18", "cat": "C3", "god": "七殺", "name": "暴衝爆量", "man": "一天塞爆、隔天崩盤", "act": "暴衝爆量隔天崩。設每日量上限、超過不准，留兩成緩衝；穩定的可持續配速，長期產出遠勝忽快忽崩。", "care": false}, {"id": "C3-19", "cat": "C3", "god": "七殺", "name": "報復性熬夜趕", "man": "白天拖、晚上狂趕", "act": "報復性熬夜趕傷恢復。設「熄燈線」、過點未完就停；固定起床時間穩住生理節律（刺激控制），白天才追得回。", "care": false}, {"id": "C3-20", "cat": "C3", "god": "正官", "name": "流程僵化", "man": "非照固定順序不可，卡住停擺", "act": "流程僵化一卡就停擺。允許「跳關」，卡住先做下一塊、回頭再補；把固定順序當參考而非鐵律，維持前進。", "care": false}, {"id": "C3-21", "cat": "C3", "god": "正官", "name": "過度檢查", "man": "反覆核對不前進", "act": "反覆檢查是焦慮找確定。立規則「最多檢查兩遍就交」，用計時逼自己相信第一判斷；把省下的時間拿去多做一題。", "care": false}, {"id": "C3-22", "cat": "C3", "god": "偏印", "name": "想流程想到不做", "man": "計畫想半天卻沒動手", "act": "想流程想到不做。想最多5分鐘就強制執行，用 if-then 把計畫變成「此刻就做第一步」；規劃的安全感不能取代行動。", "care": false}, {"id": "C3-23", "cat": "C3", "god": "偏印", "name": "卡題硬鑽", "man": "一題卡住不肯跳過", "act": "卡題硬鑽會卡死整段。設「卡20分鐘就跳下一題」、標記回頭再攻；先維持前進，難題留到狀態好時集中處理。", "care": false}, {"id": "C3-24", "cat": "C3", "god": "正印", "name": "等準備好才動", "man": "工具不齊不開始", "act": "工具不齊就不開始是藉口。用現有的先開始、缺的邊做邊補；真正需要的只是動手，完美條件是加分不是前提。", "care": false}, {"id": "C3-25", "cat": "C3", "god": "正印", "name": "賴床晚啟動", "man": "一早就荒廢掉", "act": "賴床荒廢整個早上。鬧鐘響「腳先落地＋冷水洗臉＋開窗光照」啟動身體；用 if-then 預設起床後第一個動作。", "care": false}, {"id": "C4-01", "cat": "C4", "god": "比肩", "name": "逞強不補眠", "man": "硬撐少睡", "act": "少睡會直接砍記憶與專注。固定就寢與起床時間（CBT-I 核心），別用犧牲睡眠換時數；睡飽的腦讀得更快更牢。", "care": false}, {"id": "C4-02", "cat": "C4", "god": "比肩", "name": "久坐僵硬", "man": "不肯停下伸展", "act": "久坐讓身體僵、腦變鈍。每小時起身伸展1–2分鐘、動開肩頸腰背；規律微活動能維持循環與專注。", "care": false}, {"id": "C4-03", "cat": "C4", "god": "劫財", "name": "飲食急亂", "man": "邊讀邊扒飯、消化差", "act": "邊讀邊扒飯傷消化也分心。吃飯離桌專心15分鐘、細嚼慢嚥；規律定時進食穩住血糖，腦力才有支撐。", "care": false}, {"id": "C4-04", "cat": "C4", "god": "劫財", "name": "過量咖啡因", "man": "靠提神飲料硬撐", "act": "過量咖啡因會反噬睡眠。下午後改無咖啡因、別靠提神飲料硬撐；真正解疲勞的是規律睡眠，不是越喝越多。", "care": false}, {"id": "C4-05", "cat": "C4", "god": "食神", "name": "嘴饞亂吃", "man": "零食不停、血糖亂", "act": "零食不停讓血糖起伏、更累。備堅果/水果取代甜食、定時正餐；穩定血糖有助維持專注與情緒。", "care": false}, {"id": "C4-06", "cat": "C4", "god": "食神", "name": "慵懶不動", "man": "整天不運動、身體鈍", "act": "整天不動身體會鈍。每天10–20分鐘快走或伸展、排進固定時段；規律活動能改善精神、睡眠與情緒，CP值很高。", "care": false}, {"id": "C4-07", "cat": "C4", "god": "傷官", "name": "作息任性", "man": "想睡才睡、日夜顛倒", "act": "日夜顛倒先穩「起床時間」。固定每天同一時間起床＋晨光照射校準生理時鐘（CBT-I），比先調就寢更有效。", "care": false}, {"id": "C4-08", "cat": "C4", "god": "傷官", "name": "硬抗身體訊號", "man": "痛了累了還撐", "act": "硬抗痛與累會累積成病。出現警訊先休10分鐘、補水伸展；身體訊號是資料不是軟弱，連續多日不適請就醫。", "care": false}, {"id": "C4-09", "cat": "C4", "god": "偏財", "name": "熬夜玩耗體力", "man": "娛樂到很晚", "act": "熬夜玩透支隔天。設「螢幕宵禁」時間、把娛樂提前到白天；睡前一小時離螢幕、調暗燈光，保護睡眠節律。", "care": false}, {"id": "C4-10", "cat": "C4", "god": "偏財", "name": "三餐不定", "man": "忙外務忘了吃", "act": "忙到忘了吃會掉專注。設用餐鬧鐘、定時進食；每餐有蛋白質與蔬菜，別讓空腹太久造成血糖與情緒波動。", "care": false}, {"id": "C4-11", "cat": "C4", "god": "正財", "name": "壓縮睡眠換時間", "man": "捨不得休息硬省", "act": "省睡換時間是賠本。把睡眠當必要投資排進表（CBT-I）；睡眠不足會降低記憶與效率，省下的時間反而被浪費。", "care": false}, {"id": "C4-12", "cat": "C4", "god": "正財", "name": "省錢虧待身體", "man": "亂吃省伙食", "act": "亂吃省伙食會虧待腦力。一餐至少保證蛋白質＋蔬菜；穩定均衡的飲食是專注與情緒的地基，別在這裡省。", "care": false}, {"id": "C4-13", "cat": "C4", "god": "正財", "name": "肩頸緊繃累積", "man": "長期緊繃沒放鬆", "act": "長期肩頸緊繃要主動放鬆。每天熱敷/伸展肩頸5分鐘、把螢幕墊到視線高度；久不退或頭痛頻繁請就醫評估。", "care": false}, {"id": "C4-14", "cat": "C4", "god": "七殺", "name": "壓力性失眠", "man": "緊張到睡不著", "act": "壓力性失眠用刺激控制：床只用來睡、睡前1小時離螢幕並放鬆；睡前把擔憂寫下清空大腦，長期失眠建議尋求專業。", "care": false}, {"id": "C4-15", "cat": "C4", "god": "七殺", "name": "心悸腸胃緊", "man": "壓力跑到身體上", "act": "壓力跑到身體（心悸、腸胃緊）。做腹式/配速呼吸降交感神經、飲食清淡少刺激；若心悸頻繁或持續、合併不適請就醫。", "care": false}, {"id": "C4-16", "cat": "C4", "god": "七殺", "name": "透支到生病", "man": "撐到免疫崩潰", "act": "撐到免疫崩潰得不償失。出現感冒徵兆就減量休息、補眠補水；預防性踩煞車，別等病倒，身體穩了效率才穩。", "care": false}, {"id": "C4-17", "cat": "C4", "god": "正官", "name": "規律過頭緊繃", "man": "一打亂就身體緊張", "act": "太要求規律、一亂就緊繃。容許彈性、亂了不自責；把計畫當方向而非鐵律，並用慢呼吸/伸展鬆開累積的張力。", "care": false}, {"id": "C4-18", "cat": "C4", "god": "正官", "name": "憋著不喝水如廁", "man": "怕中斷不敢停", "act": "憋著不喝水如廁傷身又分心。每節下課固定喝水、如廁；適度補水有助專注，別用「怕中斷」犧牲基本需求。", "care": false}, {"id": "C4-19", "cat": "C4", "god": "正官", "name": "姿勢僵直腰背痛", "man": "端正久坐不動", "act": "端正久坐不動仍會腰背痛。重點是「常換姿勢」：每小時起身、加腰靠、伸展；久痛不退建議就醫評估。", "care": false}, {"id": "C4-20", "cat": "C4", "god": "偏印", "name": "入睡困難", "man": "躺床腦子關不掉", "act": "躺床腦關不掉。睡前把念頭寫到紙上清空、做配速呼吸；躺20分鐘睡不著就起身做無聊的事、有睡意再回床（刺激控制）。", "care": false}, {"id": "C4-21", "cat": "C4", "god": "偏印", "name": "慢性疲勞", "man": "睡了還是累、虛", "act": "睡了還累多是品質或節律問題。固定起床＋白天曬光＋規律三餐，別靠補眠硬補；長期疲勞不退請就醫檢查。", "care": false}, {"id": "C4-22", "cat": "C4", "god": "偏印", "name": "食慾不振", "man": "心思重、吃不下", "act": "心思重而吃不下。少量多餐、選清淡好入口的食物，別逼大餐；同時處理壓力源，食慾長期不振或明顯掉體重請就醫。", "care": false}, {"id": "C4-23", "cat": "C4", "god": "正印", "name": "嗜睡賴床", "man": "睡很多仍懶洋洋", "act": "睡很多仍懶，常是節律亂。固定起床時間、起床立刻接觸光照與活動；避免賴床貪睡，規律比睡長更能提神。", "care": false}, {"id": "C4-24", "cat": "C4", "god": "正印", "name": "久坐代謝低", "man": "整天窩著不動", "act": "整天窩著代謝與精神都低。每天安排一次戶外活動或快走；規律地動起來能改善能量、睡眠與情緒。", "care": false}, {"id": "C4-25", "cat": "C4", "god": "正印", "name": "依賴環境才能讀", "man": "離開暖被就無力", "act": "只在暖被裡才讀是環境制約。改用刺激控制：固定到書桌讀、床只用來睡；讓「書桌＝讀書」建立新的啟動連結。", "care": false}, {"id": "C5-01", "cat": "C5", "god": "比肩", "name": "與同儕較勁", "man": "暗中較高下傷感情", "act": "暗中較勁兩敗俱傷。把對手當隊友，共享一份筆記或互相出題；合作式學習能減壓，也讓你看見自己的盲點。", "care": false}, {"id": "C5-02", "cat": "C5", "god": "比肩", "name": "不肯示弱求助", "man": "有問題不問同學", "act": "不問會讓小問題拖大。用 if-then：「卡住15分鐘就問同學一題」；把問題寫成具體一句話，發問是聰明不是示弱。", "care": false}, {"id": "C5-03", "cat": "C5", "god": "比肩", "name": "孤狼讀書", "man": "完全切斷社交", "act": "完全斷社交會耗損心理能量。保留每週一次低負擔的短聚或通話；社會支持本身就能緩衝壓力。", "care": false}, {"id": "C5-04", "cat": "C5", "god": "劫財", "name": "易與人摩擦", "man": "急躁、說話衝", "act": "說話衝多在情緒高點。回訊息前先放10分鐘、做幾次深呼吸；冷靜後再回應，能少掉很多不必要的摩擦。", "care": false}, {"id": "C5-05", "cat": "C5", "god": "劫財", "name": "被朋友拉走", "man": "一揪就跑、時間被佔", "act": "一揪就跑會吃掉時間。把社交集中到週末一次，平日用 if-then 婉拒；先守住讀書時段，再安排相聚。", "care": false}, {"id": "C5-06", "cat": "C5", "god": "劫財", "name": "來者不拒被耗", "man": "幫忙幫到自己沒時間", "act": "來者不拒會被掏空。練習一句界線：「我這週滿了」；幫忙前先確認自己的時間，設界線不是冷漠。", "care": false}, {"id": "C5-07", "cat": "C5", "god": "食神", "name": "聊到忘讀書", "man": "一開聊就收不住", "act": "一開聊就收不住。設聊天限時鬧鐘，或約「讀完這段再聊」；把社交當完成後的獎勵，維持讀書節奏。", "care": false}, {"id": "C5-08", "cat": "C5", "god": "食神", "name": "愛揪吃喝玩", "man": "飯局聚會太多", "act": "聚會太多會排擠進度。一週社交額度設兩次、其餘婉拒；有意識地選擇，而非有揪就去。", "care": false}, {"id": "C5-09", "cat": "C5", "god": "食神", "name": "過度迎合", "man": "不好意思拒絕", "act": "不好意思拒絕會累積壓力。用漸進練習：先婉拒一次小邀約；準備一句固定的拒絕語，練多了就不彆扭。", "care": false}, {"id": "C5-10", "cat": "C5", "god": "傷官", "name": "言語得罪人", "man": "直言批評惹爭執", "act": "直言惹爭執。開口前自問「必要嗎、善意嗎、現在嗎」；把批評換成提問或我訊息，先聽再說。", "care": false}, {"id": "C5-11", "cat": "C5", "god": "傷官", "name": "頂撞師長", "man": "跟老師槓上", "act": "與師長槓上無益學習。不同意先記下、私下再談；把焦點放回「我要學到什麼」，而非爭對錯。", "care": false}, {"id": "C5-12", "cat": "C5", "god": "傷官", "name": "群組刷存在", "man": "花時間刷表現", "act": "群組刷存在很耗時。把群組設固定時段才看、關通知；把刷表現的力氣改投到實際做題與回想。", "care": false}, {"id": "C5-13", "cat": "C5", "god": "偏財", "name": "社交太廣", "man": "群組/應酬太多", "act": "社交面太廣會分散心力。退掉無關群組、精簡到少數真誠關係；備考期重質不重量。", "care": false}, {"id": "C5-14", "cat": "C5", "god": "偏財", "name": "追別人動態", "man": "被八卦消息帶走", "act": "追別人動態被帶走。限定看社群的時段、取消會引發比較的追蹤；把注意力收回自己的軌道。", "care": false}, {"id": "C5-15", "cat": "C5", "god": "偏財", "name": "人情花費壓力", "man": "應酬破財又破時間", "act": "應酬破財又破時間。婉拒非必要邀約、設社交預算與額度；把資源留給真正重要的關係與目標。", "care": false}, {"id": "C5-16", "cat": "C5", "god": "正財", "name": "計較人際得失", "man": "衡量誰對我有用", "act": "計較誰有用會讓關係變累。單純維繫兩三個真誠關係就好；支持感來自真誠互動，而非利益盤算。", "care": false}, {"id": "C5-17", "cat": "C5", "god": "正財", "name": "怕欠人情不求助", "man": "寧可自己卡著", "act": "怕欠人情而硬撐。把求助看成「聰明用資源」、日後再回報；會求助的人通常走得更快、更省力。", "care": false}, {"id": "C5-18", "cat": "C5", "god": "七殺", "name": "對人防備緊張", "man": "怕被評價不敢互動", "act": "怕被評價而緊張。用漸進暴露：從點頭問好、傳一句訊息等低風險互動開始，逐步累積「沒事」的經驗。", "care": false}, {"id": "C5-19", "cat": "C5", "god": "七殺", "name": "壓力下對人兇", "man": "壓力大就衝突", "act": "壓力大就對人兇。壓力高時減少需協調的事、先降載；感覺要爆先離場深呼吸，別在高點處理人際。", "care": false}, {"id": "C5-20", "cat": "C5", "god": "正官", "name": "太在意眼光", "man": "怕丟臉不敢發問", "act": "太在意眼光而不敢問。提醒自己「發問是常態、多數人沒那麼在意你」；用漸進暴露，先在低壓對象練習開口。", "care": false}, {"id": "C5-21", "cat": "C5", "god": "正官", "name": "被責任綁住", "man": "攬太多群體事務", "act": "攬太多群體事務會被綁死。一次只接一個義務、其餘婉拒；把界線講清楚，保護自己的核心時間。", "care": false}, {"id": "C5-22", "cat": "C5", "god": "偏印", "name": "社交退縮", "man": "越壓力越躲人", "act": "越壓力越躲人會更孤立。用漸進暴露＋行為活化：每天一次低壓互動（傳訊也算），從最小的一步重建連結。", "care": false}, {"id": "C5-23", "cat": "C5", "god": "偏印", "name": "想太多不敢開口", "man": "演練到最後沒行動", "act": "演練到最後沒行動。把目標縮到「先傳出第一句」；行動先於完美，開口後對話多半會自然接上。", "care": false}, {"id": "C5-24", "cat": "C5", "god": "正印", "name": "過度依附一人", "man": "黏著特定人求安心", "act": "只黏一個人風險高。刻意擴展到兩三個支持來源；分散依附讓你更穩，也不會壓垮對方。", "care": false}, {"id": "C5-25", "cat": "C5", "god": "正印", "name": "被動等人主動", "man": "不連絡漸漸孤立", "act": "被動等人會漸漸孤立。用 if-then：「每週主動約一次」；一個小小的主動，就能打斷越縮越孤的循環。", "care": false}, {"id": "C6-01", "cat": "C6", "god": "比肩", "name": "只認一條路", "man": "非這條不可、沒有備案", "act": "孤注一擲會放大恐懼。寫下一個 Plan B，讓「萬一」有出口；有備案反而能更穩地專注在主線上。", "care": false}, {"id": "C6-02", "cat": "C6", "god": "比肩", "name": "抗拒他人規劃", "man": "誰勸都不聽", "act": "誰勸都不聽會錯過資訊。找一位走過這條路的人聊30分鐘、只蒐集資料不必照做；多一個視角，選擇更清楚。", "care": false}, {"id": "C6-03", "cat": "C6", "god": "劫財", "name": "頻換目標", "man": "一遇挫就想轉跑道", "act": "一挫就想轉跑道會空轉。給現目標一個固定檢視期（如3個月）再決定；低潮時不換軌，用數據而非情緒判斷。", "care": false}, {"id": "C6-04", "cat": "C6", "god": "劫財", "name": "衝動放棄", "man": "想撂挑子", "act": "想撂挑子時先別決定。撐過48小時、睡飽再看；重大決定不在情緒谷底做，先降載恢復再評估。", "care": false}, {"id": "C6-05", "cat": "C6", "god": "食神", "name": "得過且過", "man": "對未來無所謂、隨它去", "act": "對未來無所謂常是耗竭的偽裝。用行為活化設一個3個月小目標，先做能感到進展的小事，方向感會回來。", "care": false}, {"id": "C6-06", "cat": "C6", "god": "食神", "name": "逃避長遠", "man": "只想享當下不想規劃", "act": "只想享當下、逃避長遠。每月花20分鐘看一次大方向就好、其餘專注當下；把遙遠目標拆成本季可做的事。", "care": false}, {"id": "C6-07", "cat": "C6", "god": "傷官", "name": "質疑努力意義", "man": "「讀這幹嘛」反骨", "act": "「讀這幹嘛」時重連動機。寫下你要這結果的三個具體理由（價值澄清）；把抽象意義換成今天的一個小行動。", "care": false}, {"id": "C6-08", "cat": "C6", "god": "傷官", "name": "反體制虛無", "man": "覺得制度不公乾脆擺爛", "act": "覺得制度不公而擺爛，傷的是自己。分清「能改的 vs 只能接受的」，把力氣投在可控處；不滿可以化成具體行動。", "care": false}, {"id": "C6-09", "cat": "C6", "god": "偏財", "name": "機會太多難取捨", "man": "什麼都想要", "act": "什麼都想要會樣樣淺。用「今年只選一件」聚焦、其餘排隊；依你的核心價值排序，先把一條走深。", "care": false}, {"id": "C6-10", "cat": "C6", "god": "偏財", "name": "被外在標準牽走", "man": "追別人定義的成功", "act": "追別人定義的成功會空。寫下自己的成功定義三條，用它當指南針；減少接觸會引發比較的訊息。", "care": false}, {"id": "C6-11", "cat": "C6", "god": "正財", "name": "只問值不值得", "man": "過度看重結果回報", "act": "只問值不值得會卡在起點。記錄過程中已獲得的能力與成長、不只看結果；把焦點從報酬移到「我學到什麼」。", "care": false}, {"id": "C6-12", "cat": "C6", "god": "正財", "name": "害怕沉沒成本", "man": "投入太多不敢轉彎", "act": "怕浪費已投入而不敢轉彎（沉沒成本）。用「從今天起的最佳選擇」思考；過去投入不該綁住未來決定。", "care": false}, {"id": "C6-13", "cat": "C6", "god": "正財", "name": "安全感焦慮", "man": "怕沒保障不敢冒險", "act": "怕沒保障而不敢動。列「最壞情況＋我能怎麼應對」，把未知變成可處理；降低不確定後，行動門檻就低了。", "care": false}, {"id": "C6-14", "cat": "C6", "god": "七殺", "name": "成敗極端", "man": "全押一次定生死", "act": "把一次考試當生死，壓力會爆。提醒自己這是多次機會之一、可重來；把「定生死」重新框成「一段過程」。", "care": false}, {"id": "C6-15", "cat": "C6", "god": "七殺", "name": "價值綁成敗", "man": "沒上＝我沒用", "act": "「沒上＝我沒用」是把價值綁成敗。刻意分開「考試結果」與「我的價值」；你的能力、關係、努力不會因一次歸零。", "care": false}, {"id": "C6-16", "cat": "C6", "god": "七殺", "name": "倒數恐懼", "man": "被人生時程逼瘋", "act": "被人生時程逼瘋。每個人時程不同，把目光從「落後多少」拉回「本季能做什麼」；年齡只是數字，方向對就好。", "care": false}, {"id": "C6-17", "cat": "C6", "god": "正官", "name": "背負應該的人生", "man": "照別人劇本走得累", "act": "照別人劇本走會累。列「我想要 vs 應該」各三條對照，把不屬於你的放下；為自己保留一點選擇權。", "care": false}, {"id": "C6-18", "cat": "C6", "god": "正官", "name": "怕走錯不敢選", "man": "卡在決定動彈不得", "act": "怕走錯而卡住。設決策期限、到期就選；多數選擇可邊走邊修，先選一個行動，資訊會在路上出現。", "care": false}, {"id": "C6-19", "cat": "C6", "god": "正官", "name": "完美藍圖癱瘓", "man": "要規劃到完美才動", "act": "要規劃到完美才動會癱瘓。先訂一版「可改的草案」就開始；計畫永遠不完美，執行才帶來進展。", "care": false}, {"id": "C6-20", "cat": "C6", "god": "偏印", "name": "存在性空虛", "man": "反覆問活著為何", "act": "反覆問活著為何時先連結。做一件助人或有意義的小事，用行動接回意義感；同時顧好睡眠與作息基礎。", "care": false}, {"id": "C6-21", "cat": "C6", "god": "偏印", "name": "過度內省", "man": "想人生想到無法生活", "act": "想人生想到無法生活。把大哉問交給「每週一次省思時段」、其餘回到具體小行動；思考過量時用身體活動拉回當下。", "care": false}, {"id": "C6-22", "cat": "C6", "god": "偏印", "name": "脫節幻想", "man": "沉在「如果」裡", "act": "沉在「如果」的幻想裡。每天落實一個具體小行動，把能量從想像導向現實；用完成的小事證明自己在前進。", "care": false}, {"id": "C6-23", "cat": "C6", "god": "正印", "name": "等貴人時機", "man": "被動盼外援", "act": "被動等貴人會原地停。先主動踏出一步（投履歷、開口問、做一題）；機會多半在行動之後才出現。", "care": false}, {"id": "C6-24", "cat": "C6", "god": "正印", "name": "賴熟悉不敢變", "man": "怕離開舒適圈", "act": "怕離開舒適圈。用漸進暴露：做一個低風險的新嘗試，成功一次再加一點；改變從小到不怕的一步開始。", "care": false}, {"id": "C6-25", "cat": "C6", "god": "正印", "name": "沒主見", "man": "依賴他人定義方向", "act": "沒主見、依賴他人定方向。先自己寫一版人生草圖（就算粗糙）再去徵詢；有了初稿，別人的意見才是參考不是指令。", "care": false}, {"id": "C7-01", "cat": "C7", "god": "比肩", "name": "不准自己休息", "man": "休息有罪惡感", "act": "休息有罪惡感會讓你休不好。把休息排進表、當任務完成；「恢復」是維持表現的必要環節，不是偷懶。", "care": false}, {"id": "C7-02", "cat": "C7", "god": "比肩", "name": "硬撐式恢復", "man": "累到極限才停", "act": "撐到極限才停會崩。改「預防性休息」：在還沒透支前就主動停；有節奏的張弛比硬撐到底更可持續。", "care": false}, {"id": "C7-03", "cat": "C7", "god": "比肩", "name": "不肯放慢", "man": "一直全速不降配速", "act": "一直全速會燒乾。每週安排一天「降速日」刻意放慢；持久戰需要配速，不是每天全力衝刺。", "care": false}, {"id": "C7-04", "cat": "C7", "god": "劫財", "name": "休息停不下", "man": "滑手機反而更累", "act": "滑手機式休息沒讓腦歇。改做離螢幕的活動（散步、伸展、閉眼）；真恢復是讓神經降速，不是繼續接收資訊。", "care": false}, {"id": "C7-05", "cat": "C7", "god": "劫財", "name": "報復性放縱", "man": "一放鬆就過頭", "act": "一放鬆就過頭。設放鬆的「時間與內容上限」＋鬧鐘；用刺激控制把娛樂限定在固定時段，避免報復性失控。", "care": false}, {"id": "C7-06", "cat": "C7", "god": "劫財", "name": "碎片休息無效", "man": "一直被打斷", "act": "一直被打斷的休息無效。給自己一段30分鐘、不被打擾、不碰手機的完整恢復；品質比次數重要。", "care": false}, {"id": "C7-07", "cat": "C7", "god": "食神", "name": "休息變失控", "man": "一耍廢就一整天", "act": "一耍廢就一整天。娛樂限時＋鬧鐘，結束就接一個最小任務；用 if-then 設定何時回到正事。", "care": false}, {"id": "C7-08", "cat": "C7", "god": "食神", "name": "追享樂越玩越空", "man": "一直追刺激回血", "act": "追刺激越玩越空。改成散步、小睡等「真恢復」；高刺激娛樂會讓神經更累，低刺激的留白才補得回電。", "care": false}, {"id": "C7-09", "cat": "C7", "god": "食神", "name": "玩完更不想動", "man": "拖延恢復正事", "act": "玩完更不想動。先做最小一步正事（兩分鐘起步）再玩，或把玩當完成後的獎勵，避免恢復變拖延。", "care": false}, {"id": "C7-10", "cat": "C7", "god": "傷官", "name": "抗拒恢復節奏", "man": "嫌規律無聊不照做", "act": "嫌規律無聊而不照做。給恢復加點變化但保留底線（固定睡眠、每日活動）；可彈性換內容，但別放掉地基。", "care": false}, {"id": "C7-11", "cat": "C7", "god": "傷官", "name": "情緒化擺爛", "man": "一不爽就報復式耍廢", "act": "一不爽就報復式耍廢。不爽時先動身體10分鐘把情緒代謝掉、再決定怎麼休；用行動打斷情緒化的擺爛。", "care": false}, {"id": "C7-12", "cat": "C7", "god": "傷官", "name": "用刺激填空虛", "man": "重口味娛樂越看越累", "act": "重口味娛樂越看越累。換低刺激活動讓神經降載（散步、發呆、聽輕音樂）；空虛用連結與小成就感補，而非更強刺激。", "care": false}, {"id": "C7-13", "cat": "C7", "god": "偏財", "name": "恢復被瓜分", "man": "休息也在忙雜事", "act": "休息還在忙雜事＝沒休。劃出一段「純恢復、不被佔用」的時間；把雜事集中到別的時段，讓休息真的是休息。", "care": false}, {"id": "C7-14", "cat": "C7", "god": "偏財", "name": "多元娛樂更累", "man": "樣樣沾、沒真歇", "act": "樣樣沾沒真歇。一次只做一種放鬆、單工地休；切換太多反而更累，專心地休一件事更能回血。", "care": false}, {"id": "C7-15", "cat": "C7", "god": "偏財", "name": "社交式休息", "man": "應酬當休息更耗", "act": "應酬當休息更耗能。安排一段獨處安靜的恢復；社交有其價值，但若它讓你更累，就先補一段不需應對人的時間。", "care": false}, {"id": "C7-16", "cat": "C7", "god": "正財", "name": "捨不得花時間", "man": "覺得休息浪費", "act": "覺得休息浪費時間。把恢復重新框成「提升效率的投資」；睡眠與休息能改善記憶與專注，省掉它反而更慢。", "care": false}, {"id": "C7-17", "cat": "C7", "god": "正財", "name": "休息也算進度", "man": "放鬆時仍焦慮", "act": "放鬆時仍焦慮、像在算進度。休息時刻意做一件「純無產出」的事，並把待辦寫下清空大腦，允許自己這段不生產。", "care": false}, {"id": "C7-18", "cat": "C7", "god": "七殺", "name": "緊到無法放鬆", "man": "停不下來", "act": "緊到停不下來。做10分鐘漸進式肌肉放鬆或配速呼吸，讓身體學會降速；緊繃是可以練習鬆開的。", "care": false}, {"id": "C7-19", "cat": "C7", "god": "七殺", "name": "恢復也設高標", "man": "連睡覺都要求完美", "act": "連睡覺都要求完美反而睡不好。放下執念，「躺著閉眼也算休息」；對睡眠的焦慮會惡化失眠，降低標準才睡得著。", "care": false}, {"id": "C7-20", "cat": "C7", "god": "正官", "name": "罪惡感不敢真休", "man": "休了還自責", "act": "休了還自責。給自己一張「休息許可證」：這段是被允許的；提醒自己硬撐到崩潰才是真浪費，休完效率更好。", "care": false}, {"id": "C7-21", "cat": "C7", "god": "正官", "name": "死板恢復流程", "man": "非某種方式不可", "act": "非某種方式不可、太死板。準備兩三種替代放鬆法輪流；恢復的重點是有效降速，而非固定儀式。", "care": false}, {"id": "C7-22", "cat": "C7", "god": "偏印", "name": "腦不停轉", "man": "越歇越想", "act": "越歇腦越轉。用「身體型活動」把注意力外移（散步、伸展、做家事）；睡前把念頭寫下清空，給大腦一個單純焦點。", "care": false}, {"id": "C7-23", "cat": "C7", "god": "偏印", "name": "獨自悶著", "man": "越宅越沉", "act": "越宅越沉。出門曬光＋一次短互動，用行為活化打斷下沉；光照與連結對情緒有實際幫助。", "care": false}, {"id": "C7-24", "cat": "C7", "god": "正印", "name": "過度休息停滯", "man": "一歇就不想動", "act": "一歇就不想動（停滯）。休息設明確結束點＋下一個小動作，用 if-then 接回行動；避免恢復變成癱在原地。", "care": false}, {"id": "C7-25", "cat": "C7", "god": "正印", "name": "依賴特定方式", "man": "沒它就焦慮", "act": "沒某個方式就焦慮。刻意準備2–3種替代放鬆法練習適應；減少對單一方式的依賴，恢復才更有韌性。", "care": false}, {"id": "C8-01", "cat": "C8", "god": "比肩", "name": "硬撐到燃盡", "man": "不求援撐到垮", "act": "硬撐到燃盡前先求援。主動找一個人講現況＋請求支援；這類過載不該再用硬撐解，先穩住睡眠、飲食與人際支持。", "care": false}, {"id": "C8-02", "cat": "C8", "god": "比肩", "name": "否認已經崩", "man": "嘴硬說沒事", "act": "嘴硬說沒事會錯過煞車點。誠實自評，需要就停；長期壓力接近過載時，承認並求助才是出路，別獨自硬撐。", "care": false}, {"id": "C8-03", "cat": "C8", "god": "劫財", "name": "崩潰邊緣亂衝", "man": "病急亂投醫亂改", "act": "崩潰邊緣亂改更亂。危機時先「穩定、不做大改動」：砍掉非必要任務、先睡飽吃好，等情緒過了再談調整。", "care": false}, {"id": "C8-04", "cat": "C8", "god": "劫財", "name": "情緒潰堤", "man": "一爆不可收", "act": "情緒潰堤先求安全。離開現場、冷水洗臉或慢吐氣呼吸降載，找人陪；今天進度先放一邊，穩定優先。", "care": false}, {"id": "C8-05", "cat": "C8", "god": "食神", "name": "擺爛麻木", "man": "什麼都不想做", "act": "什麼都不想做時，把目標縮到最小。只要求完成一件1分鐘的事（下床、喝水）；別逼振作，先動最小一步，並找人陪。", "care": true}, {"id": "C8-06", "cat": "C8", "god": "食神", "name": "享樂麻痺", "man": "暴吃暴看逃避", "act": "用暴吃暴看麻痺崩潰。找一個人陪、別獨自麻痺；先穩住睡眠與飲食，把逃避換成一個能被聽見的對話。", "care": false}, {"id": "C8-07", "cat": "C8", "god": "傷官", "name": "怨懟爆發", "man": "遷怒全世界", "act": "遷怒全世界前先離場。把怒寫出來、暫離人群、動身體降溫；這是過載的訊號，之後安排真正的減載與休息。", "care": false}, {"id": "C8-08", "cat": "C8", "god": "傷官", "name": "自毀式叛逆", "man": "乾脆全放棄", "act": "「乾脆全放棄」時先別退出。承諾「只休3天、不做永久決定」；長期壓力會扭曲判斷，先恢復再決定方向，並找人談。", "care": true}, {"id": "C8-09", "cat": "C8", "god": "偏財", "name": "顧此失彼", "man": "全面失控分崩", "act": "全面失控時做減法。只保留一件最重要的事先穩住，其餘暫時放下或請人分擔；找回一點掌控感再逐步加回。", "care": false}, {"id": "C8-10", "cat": "C8", "god": "偏財", "name": "逃進瞎忙", "man": "用外務麻痺崩潰", "act": "用瞎忙麻痺崩潰。停下來，寫出真正的壓力源；忙碌會蓋住問題，先辨識再處理，並大幅降低非必要任務。", "care": false}, {"id": "C8-11", "cat": "C8", "god": "正財", "name": "算到掏空", "man": "計較到精疲力竭", "act": "計較到精疲力竭。暫停評估、先恢復體力（睡飽、吃好、休息）；耗竭時數字算不準，身心穩了再回頭規劃。", "care": false}, {"id": "C8-12", "cat": "C8", "god": "正財", "name": "全盤皆輸的恐慌", "man": "覺得一切要完", "act": "「一切要完」多是災難化。把真實後果寫下來，多半沒想像糟；先做一次慢呼吸降焦慮，再處理眼前最小可控的一步。", "care": false}, {"id": "C8-13", "cat": "C8", "god": "正財", "name": "沉沒成本綁死", "man": "撐著不敢停反更崩", "act": "怕浪費已投入而硬撐到更崩。允許「策略性暫停」止損；停下不等於放棄，先保住身心，再決定要不要繼續。", "care": false}, {"id": "C8-14", "cat": "C8", "god": "七殺", "name": "完全耗竭(burnout)", "man": "身心皆空、燒乾", "act": "完全耗竭需要的是真正停下。強制休息數日、大幅減載、穩定睡眠飲食；若休息後仍長期空乾，請尋求專業協助。", "care": true}, {"id": "C8-15", "cat": "C8", "god": "七殺", "name": "恐慌發作", "man": "心悸發抖失控", "act": "恐慌發作時用 grounding：說出眼前5看到、4聽到、3摸到…，搭配慢吐氣呼吸，找人陪；它會過去，反覆發作請就醫評估。", "care": false}, {"id": "C8-16", "cat": "C8", "god": "七殺", "name": "自傷念頭", "man": "嚴重自責、想消失", "act": "出現想消失/自傷的念頭，代表你承受得太久太重，這不是你的錯。請現在就不要獨處，聯絡信任的人陪你；務必撥打求助專線或尋求專業，你值得被接住。", "care": true}, {"id": "C8-17", "cat": "C8", "god": "正官", "name": "責任壓垮停擺", "man": "扛太多整個當機", "act": "扛太多整個當機。卸下可延後的責任、只留核心一件；告訴一位關鍵的人你需要喘息，把過載分擔出去。", "care": false}, {"id": "C8-18", "cat": "C8", "god": "正官", "name": "怕讓所有人失望", "man": "窒息到動彈不得", "act": "怕讓所有人失望到動彈不得。告訴一位關鍵的人你需要喘息空間；你無法滿足所有期待，先照顧自己才撐得住。", "care": false}, {"id": "C8-19", "cat": "C8", "god": "正官", "name": "失序自責", "man": "一切失控、規範崩解", "act": "一切失控、規律崩解。先重建一個最小錨點（固定起床＋一餐），從一件能掌控的小事重新長出秩序，別求一次到位。", "care": false}, {"id": "C8-20", "cat": "C8", "god": "偏印", "name": "抽離麻木", "man": "像隔層玻璃看世界", "act": "像隔層玻璃的抽離感。用 grounding 把自己拉回此刻（踩地、摸物、說出眼前東西）＋規律作息；持續或頻繁請尋求專業評估。", "care": false}, {"id": "C8-21", "cat": "C8", "god": "偏印", "name": "反芻到失眠", "man": "整夜轉不停", "act": "反芻到整夜睡不著。起身把念頭寫到紙上清空，離床做無聊的事、有睡意再回（刺激控制）；長期失眠請尋求專業協助。", "care": false}, {"id": "C8-22", "cat": "C8", "god": "偏印", "name": "深度封閉", "man": "與世隔絕", "act": "與世隔絕會更沉。每天強制一次對外連結（傳訊也算）＋出門曬光；封閉時更需要一點點連結，並考慮尋求支持。", "care": true}, {"id": "C8-23", "cat": "C8", "god": "正印", "name": "退行依賴", "man": "退回什麼都要人", "act": "退回什麼都要人時，保留一件自理。接受協助的同時，每天做一件自己能完成的小事，慢慢把自主感長回來。", "care": false}, {"id": "C8-24", "cat": "C8", "god": "正印", "name": "失去動力", "man": "連起床都難", "act": "連起床都難，把目標縮到「下床＋喝水」。這常是耗竭或低潮、不是意志問題；找人陪、補休息很重要，若長期動力歸零請尋求專業協助。", "care": true}, {"id": "C8-25", "cat": "C8", "god": "正印", "name": "過度求庇護", "man": "躲回家不面對", "act": "躲回家不面對。在安全的環境裡設一個微小的重啟步驟（出門走五分鐘、做一題）；先讓自己安定，再一步步往外。", "care": false}];

function dayGZ(y,m,d){const i=((jdn(y,m,d)+49)%60+60)%60;return{gan:STEM[i%10],zhi:BR[i%12]};}
function tenGod(dm,x){const a=SW[dm],b=SW[x];if(!a||!b)return null;const dw=a[0],dy=a[1],tw=b[0],ty=b[1],same=(dy===ty);
 if(tw===dw)return same?"比肩":"劫財";if((dw+1)%5===tw)return same?"食神":"傷官";if((dw+2)%5===tw)return same?"偏財":"正財";if((tw+2)%5===dw)return same?"七殺":"正官";return same?"偏印":"正印";}
function gBadge(g){return `<span class='god' style='background:${GCOL[g]}'>${g}</span>`;}
function toggleHelp(btn){const c=btn.nextElementSibling;c.style.display=(c.style.display==='none'?'block':'none');}

let DM=null,viewY,viewM,curHits=[];
const today=new Date(); const TY=today.getFullYear(),TM=today.getMonth()+1,TD=today.getDate();

function zhiOfHour(h){const map=["子","丑","丑","寅","寅","卯","卯","辰","辰","巳","巳","午","午","未","未","申","申","酉","酉","戌","戌","亥","亥","子"];return map[h];}
function fillSelect(id,opts,def){document.getElementById(id).innerHTML=opts.map(o=>`<option value='${o.v}' ${o.v==def?'selected':''}>${o.t}</option>`).join('');}
function rebuildDays(keep){const y=+document.getElementById('by').value,m=+document.getElementById('bm').value;const dmax=new Date(y,m,0).getDate();
 let sel=keep!=null?keep:(+document.getElementById('bd').value||1); if(sel>dmax)sel=dmax;
 fillSelect('bd',Array.from({length:dmax},(_,i)=>({v:i+1,t:(i+1)+' 日'})),sel);}
function initInputs(){
 const yrs=[];for(let y=2099;y>=1900;y--)yrs.push({v:y,t:y+' 年'});
 fillSelect('by',yrs,TY);
 fillSelect('bm',Array.from({length:12},(_,i)=>({v:i+1,t:(i+1)+' 月'})),TM);
 rebuildDays(TD);
 const hrs=[{v:'',t:'不確定／不填'}];for(let h=0;h<24;h++)hrs.push({v:h,t:`${pad2(h)} 時（${zhiOfHour(h)}）`});
 fillSelect('bh',hrs,'');
 document.getElementById('by').addEventListener('change',()=>rebuildDays());
 document.getElementById('bm').addEventListener('change',()=>rebuildDays());
}
initInputs();

function calcBazi(){
 let y=+document.getElementById('by').value,m=+document.getElementById('bm').value,d=+document.getElementById('bd').value;
 const hRaw=document.getElementById('bh').value,h=(hRaw===''?null:+hRaw);
 let py=y,pm=m,pd=d;
 if(h!==null&&h>=23){const t=new Date(y,m-1,d);t.setDate(t.getDate()+1);py=t.getFullYear();pm=t.getMonth()+1;pd=t.getDate();}
 const dg=dayGZ(py,pm,pd);DM=dg.gan;
 let shiTxt='';
 if(h!==null){const zi=Math.floor(((h+1)%24)/2);const sg=STEM[(STEM.indexOf(DM)*2+zi)%10];shiTxt=`　時柱 ${sg}${BR[zi]}`;}
 const wx="木火土金水"[SW[DM][0]];
 document.getElementById('bazi').innerHTML=`推算結果：日柱 <b>${dg.gan}${dg.zhi}</b>（日主＝<b>${DM}</b>・${wx}）${shiTxt}
   <div class='kv' style='margin-top:4px'>之後月曆每日的運勢能量，皆以此日主與當日流日干支推算。</div>`;
 viewY=TY;viewM=TM;renderDOW();renderCal();
 document.getElementById('calpanel').style.display='block';
 openDay(TY,TM,TD,true);
 document.getElementById('calpanel').scrollIntoView({behavior:'smooth'});
}
function renderDOW(){document.getElementById('dow').innerHTML=['日','一','二','三','四','五','六'].map(w=>`<div class='dow'>${w}</div>`).join('');}

function dayInfo(y,m,d){
 const gz=dayGZ(y,m,d);const w={};const addw=(g,v)=>{if(g)w[g]=Math.max(w[g]||0,v);};
 const gStem=tenGod(DM,gz.gan);addw(gStem,3);
 const hid=HIDDEN[gz.zhi];const gMain=tenGod(DM,hid[0]);addw(gMain,2);
 const others=hid.slice(1).map(h=>tenGod(DM,h));others.forEach(g=>addw(g,1));
 let stress=0;for(const g in w)stress+=(STRESS[g]||1)*w[g];
 const hit=[];
 for(const s of SYM){if(w[s.god]){let r=w[s.god]*2+(s.care?2:0);hit.push({...s,r});}}
 hit.sort((a,b)=>b.r-a.r||(b.care-a.care));
 return {gz,w,gStem,gMain,others,hid,raw:stress,hit};
}
function tierOfMonth(y,m,raw){const days=new Date(y,m,0).getDate();const raws=[];for(let d=1;d<=days;d++)raws.push(dayInfo(y,m,d).raw);
 const mn=Math.min(...raws),mx=Math.max(...raws);if(mx===mn)return 3;return Math.min(5,Math.max(1,Math.floor((raw-mn)/(mx-mn)*5)+1));}

function renderCal(){
 document.getElementById('monlabel').textContent=`${viewY} 年 ${viewM} 月`;
 const startCol=new Date(viewY,viewM-1,1).getDay();const days=new Date(viewY,viewM,0).getDate();
 let cells='';for(let i=0;i<startCol;i++)cells+="<div class='cell empty'></div>";
 for(let d=1;d<=days;d++){
   const info=dayInfo(viewY,viewM,d);const tier=tierOfMonth(viewY,viewM,info.raw);const lv=6-tier;
   const isToday=(viewY===TY&&viewM===TM&&d===TD);
   const dow=new Date(viewY,viewM-1,d).getDay();const ymd=`${viewY}-${pad2(viewM)}-${pad2(d)}`;const hol=HOLIDAYS[ymd];
   const dcol=(dow===0||dow===6||hol)?'#c0392b':'#33414a';
   let segs='';for(let k=1;k<=5;k++)segs+=`<div class='seg' style='background:${k<=lv?LVCOL[lv]:'#e7ebee'}'></div>`;
   cells+=`<div class='cell ${isToday?'today':''}' onclick='openDay(${viewY},${viewM},${d})'>
     <div class='dnum' style='color:${dcol}'>${d}${isToday?" <span style='font-size:10px;color:#c0392b'>今天</span>":""}</div>
     <div class='gz'>${info.gz.gan}${info.gz.zhi}</div>${hol?`<div class='hol'>${hol}</div>`:''}
     <div class='batt'>${segs}<div class='nub'></div></div>
     <div class='lvtag' style='color:${LVCOL[lv]}'>${LVTXT[lv]}</div></div>`;
 }
 document.getElementById('cal').innerHTML=cells;
 document.getElementById('legend').innerHTML="<span style='font-weight:bold'>當日運勢能量</span>"+[1,2,3,4,5].map(l=>`<span class='lg'><span class='dot' style='background:${LVCOL[l]}'></span>${l}・${LVTXT[l]}</span>`).join('');
}
function shiftMonth(n){viewM+=n;if(viewM<1){viewM=12;viewY--;}if(viewM>12){viewM=1;viewY++;}renderCal();}

function openDay(y,m,d,noScroll){
 const info=dayInfo(y,m,d);
 const tier=tierOfMonth(y,m,info.raw);const lv=6-tier;
 // 高關懷(⚠)條目僅在能量 1(紅)、2(橘)的日子顯示；3-5 不出現
 const scored=(lv<=2)?info.hit:info.hit.filter(s=>!s.care);
 curHits=scored;
 let big='';for(let k=1;k<=5;k++)big+=`<div class='seg' style='background:${k<=lv?LVCOL[lv]:'#e7ebee'}'></div>`;
 const trig=Object.keys(info.w).sort((a,b)=>info.w[b]-info.w[a]).map(g=>gBadge(g)).join('　');
 const groupHTML=(list)=>{const byCat={};list.forEach(s=>{(byCat[s.cat]=byCat[s.cat]||[]).push(s);});
   return Object.keys(byCat).sort().map(c=>{const items=byCat[c].map(s=>`<label class='clitem ${s.care?'care':''}'><input type='checkbox' value='${s.id}'><span class='nm'>${s.name}${s.care?" ⚠":""}</span></label>`).join('');
     return `<div class='clcat'><div class='cn'>${CATN[c]}</div><div class='clitems'>${items}</div></div>`;}).join('');};
 const TOPN=8;const top=scored.slice(0,TOPN),rest=scored.slice(TOPN);
 const checklist=scored.length?groupHTML(top)+(rest.length?`<div style='margin-top:10px'><button class='nav' type='button' onclick="const r=document.getElementById('clrest');r.style.display=r.style.display==='none'?'block':'none';this.textContent=r.style.display==='none'?'顯示更多（${rest.length}）▾':'收合 ▴';">顯示更多（${rest.length}）▾</button><div id='clrest' style='display:none;margin-top:10px'>${groupHTML(rest)}</div></div>`:''):"<div class='empty2'>今日無明顯對應狀況。</div>";
 document.getElementById('detail').style.display='block';
 document.getElementById('detail').innerHTML=`<div class='dhead'><span class='dt'>${y}/${m}/${d}</span>
   <span class='kv' style='font-size:15px'>流日 <b>${info.gz.gan}${info.gz.zhi}</b></span>
   <span class='bigbatt'>${big}<div class='nub'></div></span>
   <span class='kv' style='color:${LVCOL[lv]};font-weight:bold'>運勢能量 ${lv}・${LVTXT[lv]}</span></div>
  <div class='kv'>引動十神：${trig}</div>
  <div class='riskbar' style='${RB[lv][0]}'>${RB[lv][1]}</div>
  <div class='cltitle'>這個日子裡，比較容易浮現以下幾種傾向（已挑出最相關的幾項）。請勾選你當下最有感的：</div>
  <div id='checklist'>${checklist}</div>
  ${scored.length?`<div class='confirmbar'><button onclick='confirmDay()'>確認，顯示建議</button><span class='muted'>勾選後按確認，才會出現對應的具體建議行為。</span></div>`:''}
  <div id='dayresult'></div>`;
 if(!noScroll) document.getElementById('detail').scrollIntoView({behavior:'smooth'});
}

function confirmDay(){
 const checked=[...document.querySelectorAll('#checklist input:checked')].map(i=>i.value);
 const box=document.getElementById('dayresult');
 if(!checked.length){box.innerHTML="<div class='advice'>你還沒勾選任何狀況。若今天其實都沒有，那很好 —— 維持你的節奏就好 :)</div>";return;}
 const picked=curHits.filter(s=>checked.includes(s.id));
 // 主修復方向：取勾選中引動最強的十神
 const gc={};picked.forEach(s=>gc[s.god]=(gc[s.god]||0)+1);
 const topGod=Object.keys(gc).sort((a,b)=>gc[b]-gc[a])[0];
 const byCat={};picked.forEach(s=>{(byCat[s.cat]=byCat[s.cat]||[]).push(s);});
 const blocks=Object.keys(byCat).sort().map(c=>{const items=byCat[c].map(s=>`<div class='card ${s.care?'care':''}'>
     <div class='top'><span class='nm'>${s.name}</span>${gBadge(s.god)}${s.care?"<span class='god' style='background:#c0392b'>⚠ 高關懷</span>":""}</div>
     <div class='man'>${s.man}</div><div class='act'>${s.act}</div>
     ${s.care?"<div class='carenote'><div class='carewarm'>每個人都會偶爾碰到卡卡的那一天，這很正常。如果這份感受比較強烈、或一直揮之不去，請別一個人硬撐——找個信任的人聊聊，會很不一樣。</div><button type='button' class='careBtn' onclick='toggleHelp(this)'>台灣的求助資源超棒！點我看免費專線 ▸</button><div class='carecard' style='display:none'><div class='cc-title'>免費心理支持專線，有人會聽你說：</div><a href='tel:1925'>安心專線 1925</a><a href='tel:1995'>生命線 1995</a><a href='tel:1980'>張老師 1980</a><span class='cc-note'>撥打免費。若有立即危險，請撥 110 或 119。</span></div></div>":""}</div>`).join('');
   return `<div class='catblk'><div class='cathead'>${CATN[c]}</div><div class='cards'>${items}</div></div>`;}).join('');
 box.innerHTML=`${topGod?`<div class='advice'><b>你當日要注意的方面：</b>${gBadge(topGod)}　${GODDIR[topGod]}</div>`:''}
   <div class='kv' style='font-weight:bold;margin:6px 0'>你勾選的狀況與具體建議（${picked.length} 筆）</div>${blocks}
   <div class='foot'>建議方法依據實證取向：主動回憶與間隔複習、執行意圖 if-then、表達性書寫與認知重評、配速呼吸、CBT-I 刺激控制、行為活化、漸進暴露等。本頁非醫療診斷。</div>`;
 box.scrollIntoView({behavior:'smooth'});
}
</script>
</div></body></html>
